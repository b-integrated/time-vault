<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeVault - Time Tracking & Invoicing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css?v=20260803-1248">
  <link rel="icon" href="images/favicon.ico">
</head>
<body>
  <div id="root"></div>

  <!-- Runtime dependencies served locally so Time Vault works inside Tailscale even if external CDNs are blocked. -->
  <script src="vendor/react.production.min.js?v=20260803-1248"></script>
  <script src="vendor/react-dom.production.min.js?v=20260803-1248"></script>
  <script src="vendor/babel.min.js?v=20260803-1248"></script>
  
  <!-- Custom Scripts -->
  <script type="text/babel" src="js/components/FirstTimeSetup.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Auth.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Dashboard.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/TimeTracker.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Projects.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Clients.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Invoices.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/HarvestImport.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Reports.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/components/Settings.js?v=20260803-1248"></script>
  <script type="text/babel" src="js/App.js?v=20260803-1248"></script>
  
  <!-- Main entry point -->
  <script type="text/babel">
    // Main entry point for the TimeVault React application
    console.log('index.js loaded');
    console.log('React:', React);
    console.log('ReactDOM:', ReactDOM);

    try {
      // Get the root element
      const rootElement = document.getElementById('root');
      console.log('Root element:', rootElement);
      
      if (rootElement) {
        // Create a React root and render the App component
        const root = ReactDOM.createRoot(rootElement);
        console.log('React root created');
        
        root.render(React.createElement(App));
        console.log('App rendered');
      } else {
        console.error('Root element not found');
      }
    } catch (error) {
      console.error('Error rendering App:', error);
    }
  </script>
</body>
</html>
